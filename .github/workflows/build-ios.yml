name: Build iOS IPA

on:
  workflow_call:
    inputs:
      upload-artifacts:
        required: false
        type: boolean
        default: true

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Qt for macOS (host tools)
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.4.2'
        host: 'mac'
        target: 'desktop'
        arch: 'clang_64'
        cache: true
    
    - name: Save host Qt path
      run: |
        echo "QT_HOST_PATH=${{ github.workspace }}/../Qt/6.4.2/macos" >> $GITHUB_ENV
        echo "QT_HOST_PATH_CMAKE_DIR=${{ github.workspace }}/../Qt/6.4.2/macos/lib/cmake" >> $GITHUB_ENV
        
    - name: Install Qt for iOS
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.4.2'
        host: 'mac'
        target: 'ios'
        arch: 'ios'
        modules: 'qtmultimedia'
        cache: true
        
    - name: Configure for iOS
      run: |
        cmake -B build-ios \
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/../Qt/6.4.2/ios \
          -DCMAKE_FIND_ROOT_PATH=${{ github.workspace }}/../Qt/6.4.2/ios \
          -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH \
          -DQT_HOST_PATH=${{ env.QT_HOST_PATH }} \
          -DQT_HOST_PATH_CMAKE_DIR=${{ env.QT_HOST_PATH_CMAKE_DIR }} \
          -GXcode \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
          -DCMAKE_BUILD_TYPE=Release
          
    - name: Build
      run: |
        cmake --build build-ios --config Release -- -sdk iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
        
    - name: Create IPA (unsigned)
      run: |
        mkdir -p Payload
        cp -r build-ios/Release-iphoneos/uScope.app Payload/
        zip -r uScope-0.1.0-ios.ipa Payload
        
    - name: Upload iOS artifact
      if: inputs.upload-artifacts
      uses: actions/upload-artifact@v4
      with:
        name: uscope-ios
        path: uScope-0.1.0-ios.ipa
      continue-on-error: true
